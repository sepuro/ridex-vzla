<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Canvas Gradient -->
    <radialGradient id="canvasGrad" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#030508" />
    </radialGradient>

    <!-- Electric Emerald to Hyper Cyan Velocity Gradient -->
    <linearGradient id="neonSpeedGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#00E599" />
      <stop offset="45%" stop-color="#00F5A0" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <!-- Wing Highlight Gradient -->
    <linearGradient id="wingGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#00E599" stop-opacity="0.3" />
    </linearGradient>

    <!-- Ambient Core Glow -->
    <filter id="ambientNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="32" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Crisp Premium Drop Shadow -->
    <filter id="crispShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- 1. Squircle Base Container (Modern App Icon Standard) -->
  <rect width="512" height="512" rx="124" fill="url(#canvasGrad)" />
  
  <!-- Subtle Hardware Bevel Stroke -->
  <rect x="6" y="6" width="500" height="500" rx="118" fill="none" stroke="rgba(255, 255, 255, 0.09)" stroke-width="2.5" />

  <!-- 2. Concentric Orbital Precision Navigation Ring -->
  <circle cx="256" cy="256" r="184" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1.5" />
  <circle cx="256" cy="256" r="184" fill="none" stroke="url(#neonSpeedGrad)" stroke-width="2" stroke-dasharray="14 120" stroke-linecap="round" opacity="0.6" />

  <!-- 3. Ambient Neon Lighting Flare -->
  <circle cx="256" cy="245" r="120" fill="#00E599" opacity="0.12" filter="url(#ambientNeon)" />

  <!-- 4. Pure Vector Monogram: High-Precision 'RX' Speed Sculpture -->
  <g filter="url(#crispShadow)">
    <!-- Vertical Pillar of Stability (R Stem) -->
    <rect x="136" y="124" width="46" height="264" rx="23" fill="url(#neonSpeedGrad)" />

    <!-- Aerodynamic Upper Canopy (R Curve) -->
    <path
      d="M 159 124
         C 264 124, 348 140, 348 214
         C 348 284, 264 298, 159 298"
      fill="none"
      stroke="url(#neonSpeedGrad)"
      stroke-width="46"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Velocity Kick (R Leg turning into X Forward Drive) -->
    <path
      d="M 226 270
         L 356 388"
      fill="none"
      stroke="url(#neonSpeedGrad)"
      stroke-width="46"
      stroke-linecap="round"
    />

    <!-- Cross Aerodynamic Wing (X Transverse Blade) -->
    <path
      d="M 358 132
         L 282 208"
      fill="none"
      stroke="url(#wingGrad)"
      stroke-width="32"
      stroke-linecap="round"
    />

    <!-- Speed Apex Arrowhead in negative space -->
    <circle cx="242" cy="214" r="15" fill="#FFFFFF" />
    <circle cx="242" cy="214" r="27" fill="none" stroke="#00E599" stroke-width="4" opacity="0.75" />
  </g>

  <!-- Dynamic Velocity Dash Accents -->
  <line x1="90" y1="214" x2="108" y2="214" stroke="#00E599" stroke-width="6" stroke-linecap="round" opacity="0.5" />
  <line x1="78" y1="240" x2="108" y2="240" stroke="#00D2FF" stroke-width="6" stroke-linecap="round" opacity="0.7" />
  <line x1="90" y1="266" x2="108" y2="266" stroke="#00E599" stroke-width="6" stroke-linecap="round" opacity="0.5" />
</svg>
