<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D14" />
      <stop offset="100%" stop-color="#161F30" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo oscuro redondeado -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#27354D" stroke-width="6" />

  <!-- Acento de brillo circular -->
  <circle cx="256" cy="256" r="160" fill="#10B981" opacity="0.08" filter="url(#glow)" />

  <!-- Símbolo estilizado 'R' con flecha de movilidad -->
  <g fill="none" stroke="url(#accentGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Barra vertical de la R -->
    <line x1="168" y1="130" x2="168" y2="382" />
    <!-- Bucle superior de la R -->
    <path d="M 168 140 C 260 140, 330 150, 330 220 C 330 290, 260 300, 168 300" />
    <!-- Pata diagonal dinámica / flecha -->
    <path d="M 240 290 L 334 382" />
  </g>

  <!-- Pequeño punto de geolocalización / GPS -->
  <circle cx="346" cy="154" r="22" fill="#F59E0B" filter="url(#glow)" />
</svg>
