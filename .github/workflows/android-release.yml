name: Build Android Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Etiqueta de versión (ej: v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias y de integración
        run: npm test

      - name: Compilar frontend optimizado (Vite PWA)
        run: npm run build

      - name: Inicializar y sincronizar Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cd ..

      - name: Preparar artefacto APK
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/RideX-Venezuela.apk

      - name: Subir artefacto APK a GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: RideX-Venezuela-APK
          path: release-output/RideX-Venezuela.apk

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: RideX Venezuela Release ${{ github.ref_name || inputs.version }}
          tag_name: ${{ github.ref_name || inputs.version }}
          body: |
            ## 🚗 RideX Venezuela — Versión Oficial para Android

            Descarga el archivo APK **`RideX-Venezuela.apk`** para instalar la aplicación en cualquier teléfono Android.

            ### ✨ Características de esta versión:
            - **Moneda Dual:** Cotización en USD ($) y Bolívares (Bs.) en base a tasa oficial BCV.
            - **Pasarela Venezolana:** Pago Móvil con catálogo de más de 20 bancos nacionales y verificación de referencia.
            - **Efectivo USD:** Calculadora automática de vuelto exacto.
            - **Vehículos:** Moto Express (ágil para colas), Carro Estándar y Carro Confort (con A/C).
            - **Mapas Ligeros:** Leaflet / OpenStreetMap de ultra-bajo consumo de datos 3G/4G.
            - **Tiempo Real:** Despacho bidireccional entre Pasajero y Conductor.
            - **Alertas Hápticas y Sonoras:** Notificaciones con tono y vibración en Android.
          files: release-output/RideX-Venezuela.apk
          draft: false
          prerelease: false
