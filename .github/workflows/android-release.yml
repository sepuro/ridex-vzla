name: Build Android Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Etiqueta de versión (ej: v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias y de integración
        run: npm test

      - name: Compilar frontend optimizado (Vite PWA)
        run: npm run build

      - name: Sincronizar Capacitor Android
        run: npx cap sync android

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK con Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cd ..

      - name: Preparar artefacto APK
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/RideX-Venezuela.apk

      - name: Subir artefacto APK a GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: RideX-Venezuela-APK
          path: release-output/RideX-Venezuela.apk

      - name: Publicar GitHub Release con APK adjunto
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: RideX Venezuela Release ${{ github.ref_name || inputs.version }}
          tag_name: ${{ github.ref_name || inputs.version }}
          body: |
            ## 🚗 RideX Venezuela — Versión Oficial para Android

            Descarga el archivo APK adjunto **`RideX-Venezuela.apk`** para instalar la aplicación directamente en cualquier teléfono Android.

            ### ✨ Características de esta versión:
            - **Moneda Dual:** Cotización en USD ($) y Bolívares (Bs.) con tasa oficial BCV.
            - **Pasarela Venezolana:** Pago Móvil (BDV, Banesco, Mercantil, Bancamiga, Provincial y más) con verificación de referencia.
            - **Efectivo USD:** Calculadora automática de vuelto.
            - **Vehículos:** Moto Express (ágil para colas), Carro Estándar y Carro Confort (con A/C).
            - **Mapas:** OpenStreetMap optimizado para redes 3G/4G venezolanas.
            - **Sincronización:** Pasajero y Conductor en tiempo real.
          files: release-output/RideX-Venezuela.apk
          draft: false
          prerelease: false
